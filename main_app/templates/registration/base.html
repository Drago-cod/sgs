{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>JASS — Account Recovery</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
        (function () {
            try {
                var saved = localStorage.getItem("sgs-theme");
                if (saved === "dark" || saved === "light") {
                    document.documentElement.setAttribute("data-theme", saved);
                }
            } catch (e) {}
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'plugins/fontawesome-free/css/all.min.css' %}" />
    <link rel="stylesheet" href="{% static 'plugins/icheck-bootstrap/icheck-bootstrap.min.css' %}" />
    <link rel="stylesheet" href="{% static 'dist/css/adminlte.min.css' %}" />
    <link rel="stylesheet" href="{% static 'dist/css/enterprise-theme.css' %}" />
</head>
<body class="hold-transition login-page" style="background: #F4F7FB; min-height: 100vh;">
    <div class="login-box" style="width: 420px; max-width: 94%;">
        <div class="text-center mb-4">
            <a href="/" class="d-inline-flex align-items-center text-decoration-none" style="gap: 12px;">
                <img src="{% static 'img/logo.jpeg' %}" alt="JASS Logo" style="width: 48px; height: 48px; border-radius: 12px; object-fit: cover; border: 2px solid #14B8A6;">
                <div class="text-left">
                    <div style="font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #0D9488;">JASS Portal</div>
                    <div style="font-size: 1.05rem; font-weight: 700; color: #14243A;">Students' Grading System</div>
                </div>
            </a>
        </div>
        <div class="card">
          {% block content %}
          {% endblock content %}
        </div>
    </div>
    <script src="{% static 'plugins/jquery/jquery.min.js' %}"></script>
    <script src="{% static 'plugins/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'dist/js/adminlte.min.js' %}"></script>
</body>
</html>
