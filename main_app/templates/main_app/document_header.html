{% load static %}
<style>
.school-doc-watermark-layer {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 360px;
    max-width: 60vw;
    opacity: 0.07;
    pointer-events: none;
    user-select: none;
    z-index: 0;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
}
.school-doc-header,
.school-doc-header ~ * {
    position: relative;
    z-index: 1;
}
@media print {
    .school-doc-watermark-layer {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 380px;
        opacity: 0.08 !important;
        z-index: 0;
    }
}
</style>
<img src="{% static 'img/logo.jpeg' %}" alt="" aria-hidden="true" class="school-doc-watermark-layer">
<div class="school-doc-header" style="display:flex;align-items:center;justify-content:center;gap:20px;border-bottom:3px solid #14243A;padding-bottom:16px;margin-bottom:20px;text-align:center;">
    <img src="{% static 'img/logo.jpeg' %}" alt="Juba Adventist Secondary School Logo"
         style="height:82px;width:82px;object-fit:contain;border-radius:10px;flex-shrink:0;">
    <div>
        <h3 style="margin:0 0 4px;font-weight:700;color:#14243A;font-size:1.35rem;letter-spacing:0.2px;">
            JUBA ADVENTIST SECONDARY SCHOOL (JASS)
        </h3>
        <p style="margin:0 0 2px;color:#475569;font-size:0.9rem;">Seventh-day Round About, Juba, South Sudan</p>
        <p style="margin:0 0 6px;color:#64748B;font-size:0.86rem;">Phone: +211 923 580 078</p>
        {% if doc_title %}
        <div style="display:inline-block;background:#F4F7FB;border:1px solid #E5EAF1;color:#14243A;font-weight:700;padding:4px 14px;border-radius:999px;font-size:0.85rem;text-transform:uppercase;letter-spacing:0.5px;">
            {{ doc_title }}
        </div>
        {% endif %}
        {% if doc_subtitle %}
        <p style="margin:6px 0 0;color:#64748B;font-size:0.84rem;">{{ doc_subtitle }}</p>
        {% endif %}
    </div>
</div>
