services:
  - type: web
    name: student-management-system
    env: python
    buildCommand: ./build_files.sh
    startCommand: gunicorn student_management_system.wsgi:application
    branch: main
    region: oregon
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: student_management_system.settings
      - key: PYTHON_VERSION
        value: 3.12.7
